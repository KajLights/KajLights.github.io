<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">USB-powered Pico build: three wires to the lights</title>
  <desc id="desc">The computer powers the Pico 2 W through Micro-USB. Three wires join the Pico to the LED strip: VBUS to 5 V, GND to GND, and GP16 directly to the first LED DIN. There is no separate supply, capacitor, resistor or level shifter. Unplug USB before wiring. This shows connections, not physical pin positions.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#19747b"/></marker>
    <marker id="usb-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6661a6"/></marker>
  </defs>
  <rect width="1280" height="680" rx="20" fill="#f8f7f1"/>
  <g font-family="system-ui, sans-serif" fill="#123e46">
    <text x="42" y="42" font-size="19" font-weight="700">THE FIRST BUILD: THREE WIRES AND ONE USB CABLE</text>
    <rect x="70" y="80" width="280" height="85" rx="12" fill="#edeaf7" stroke="#6661a6" stroke-width="2"/>
    <text x="210" y="116" font-size="26" text-anchor="middle" font-weight="700">Computer</text>
    <text x="210" y="145" font-size="20" text-anchor="middle">USB power + data</text>
    <path d="M210 165 V239" fill="none" stroke="#6661a6" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#usb-arrow)"/>
    <text x="250" y="210" font-size="19">Micro-USB</text>
    <text x="545" y="130" font-size="25" font-weight="700">USB powers the board and the lights.</text>
    <text x="545" y="164" font-size="21">The Pico sends the colour instructions.</text>

    <rect x="70" y="250" width="280" height="300" rx="16" fill="#e2eee4" stroke="#2c6b5b" stroke-width="3"/>
    <text x="96" y="291" font-size="29" font-weight="700">Pico 2 W</text>
    <rect x="95" y="359" width="105" height="92" rx="5" fill="#123e46"/>
    <text x="147" y="411" font-size="21" fill="white" text-anchor="middle">RP2350</text>
    <text x="263" y="325" font-size="22" font-weight="700">VBUS</text>
    <text x="263" y="405" font-size="22" font-weight="700">GP16</text>
    <text x="263" y="490" font-size="22" font-weight="700">GND</text>
    <circle cx="350" cy="340" r="6" fill="#b24630"/>
    <circle cx="350" cy="420" r="6" fill="#19747b"/>
    <circle cx="350" cy="505" r="6" fill="#43575d"/>

    <path d="M350 340 H860" stroke="#b24630" stroke-width="5" fill="none"/>
    <text x="605" y="320" font-size="23" text-anchor="middle" fill="#9a3726" font-weight="700">Power · VBUS → 5V</text>
    <path d="M350 420 H852" stroke="#19747b" stroke-width="5" fill="none" marker-end="url(#data-arrow)"/>
    <text x="605" y="399" font-size="23" text-anchor="middle" fill="#19747b" font-weight="700">Colour instructions · GP16 → DIN</text>
    <path d="M350 505 H860" stroke="#43575d" stroke-width="5" fill="none"/>
    <text x="605" y="484" font-size="23" text-anchor="middle" fill="#43575d" font-weight="700">Return path · GND → GND</text>

    <rect x="860" y="250" width="350" height="300" rx="12" fill="white" stroke="#769a91" stroke-width="2"/>
    <text x="1035" y="289" font-size="26" text-anchor="middle" font-weight="700">5 V RGB LED strip</text>
    <text x="1035" y="317" font-size="19" text-anchor="middle">WS2812B-compatible</text>
    <text x="878" y="349" font-size="21" fill="#9a3726" font-weight="700">5V</text>
    <text x="878" y="429" font-size="21" font-weight="700">DIN</text>
    <text x="878" y="514" font-size="21" font-weight="700">GND</text>
    <g stroke="#859b92" stroke-width="2">
      <rect x="950" y="390" width="52" height="52" rx="5" fill="#ffcf66"/>
      <rect x="1030" y="390" width="52" height="52" rx="5" fill="#b7e3d9"/>
      <rect x="1110" y="390" width="52" height="52" rx="5" fill="#c9d8f2"/>
    </g>
    <text x="1050" y="477" font-size="20" text-anchor="middle">Strip arrows point this way →</text>
    <text x="42" y="609" font-size="22" font-weight="700">Unplug USB, connect the wires, check together, then plug in.</text>
    <text x="42" y="648" font-size="19">Connections shown, not physical pin positions. Use the pin diagram to find VBUS, GND and GP16.</text>
  </g>
</svg>
