<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Power upgrade: separate LED supply, with direct data</title>
  <desc id="desc">Computer powers the Pico by USB. Pico GP16 connects straight to the first LED DIN, with no level shifter or data resistor. A separate 5 V supply powers the LEDs. All grounds join. A 500 to 1000 microfarad capacitor rated at least 6.3 V sits across the LED power input, positive to 5 V, negative to ground. External 5 V does not connect to the Pico. This is a functional connection diagram, not a physical pin layout.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#19747b"/></marker>
    <marker id="usb-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6661a6"/></marker>
  </defs>
  <rect width="1280" height="680" rx="20" fill="#f8f7f1"/>
  <g font-family="system-ui, sans-serif" fill="#123e46">
    <text x="42" y="36" font-size="16" font-weight="700">POWER UPGRADE: GIVE THE LIGHTS THEIR OWN SUPPLY</text>
    <rect x="50" y="62" width="220" height="76" rx="12" fill="#edeaf7" stroke="#6661a6" stroke-width="2"/>
    <text x="160" y="94" font-size="22" text-anchor="middle" font-weight="700">Computer</text>
    <text x="160" y="120" font-size="17" text-anchor="middle">USB power + data</text>
    <path d="M160 138 V231" fill="none" stroke="#6661a6" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#usb-arrow)"/>
    <text x="45" y="190" font-size="16">Micro-USB</text>
    <rect x="50" y="240" width="220" height="210" rx="16" fill="#e2eee4" stroke="#2c6b5b" stroke-width="3"/>
    <text x="75" y="275" font-size="24" font-weight="700">Pico 2 W</text>
    <rect x="75" y="300" width="85" height="78" rx="5" fill="#123e46"/>
    <text x="117" y="344" font-size="17" fill="white" text-anchor="middle">RP2350</text>
    <text x="193" y="315" font-size="18" font-weight="700">GP16</text>
    <circle cx="270" cy="330" r="6" fill="#19747b"/>
    <text x="170" y="430" font-size="18" font-weight="700">GND</text>
    <text x="70" y="483" font-size="16">VBUS disconnected</text>
    <text x="70" y="505" font-size="16">from the LED strip</text>

    <rect x="530" y="62" width="230" height="78" rx="12" fill="#f9e8df" stroke="#b24630" stroke-width="2"/>
    <text x="645" y="93" font-size="21" text-anchor="middle" font-weight="700">Regulated 5 V DC</text>
    <text x="645" y="118" font-size="17" text-anchor="middle">LED power supply</text>
    <path d="M580 140 V185 H1135 V290 M950 185 V250" stroke="#b24630" stroke-width="5" fill="none"/>
    <circle cx="950" cy="185" r="6" fill="#b24630"/>
    <text x="780" y="172" font-size="18" fill="#9a3726" font-weight="700">+5 V: power for the LEDs</text>
    <text x="543" y="163" font-size="18" fill="#9a3726">+</text>
    <path d="M710 140 H1220 V555 H250 V450 M850 430 V555 M1135 363 V555" stroke="#43575d" stroke-width="5" fill="none"/>
    <text x="743" y="163" font-size="18">−</text>

    <text x="520" y="278" font-size="25" font-weight="700" text-anchor="middle">One data wire</text>
    <text x="520" y="307" font-size="19" text-anchor="middle">GP16 → DIN · 3.3 V signal</text>
    <path d="M270 330 H790" stroke="#19747b" stroke-width="5" fill="none" marker-end="url(#data-arrow)"/>
    <text x="520" y="384" font-size="19" text-anchor="middle">Keep this lead short.</text>
    <text x="520" y="416" font-size="18" text-anchor="middle">No level shifter or data resistor here.</text>

    <rect x="800" y="250" width="300" height="180" rx="12" fill="white" stroke="#769a91" stroke-width="2"/>
    <text x="950" y="280" font-size="22" text-anchor="middle" font-weight="700">5 V RGB LED strip</text>
    <text x="950" y="307" font-size="17" text-anchor="middle">WS2812B-compatible</text>
    <text x="810" y="348" font-size="17" font-weight="700">DIN</text>
    <g stroke="#859b92" stroke-width="2">
      <rect x="860" y="326" width="40" height="40" rx="5" fill="#ffcf66"/>
      <rect x="920" y="326" width="40" height="40" rx="5" fill="#b7e3d9"/>
      <rect x="980" y="326" width="40" height="40" rx="5" fill="#c9d8f2"/>
    </g>
    <text x="950" y="396" font-size="17" text-anchor="middle">Data follows the arrows →</text>
    <text x="829" y="419" font-size="16">GND</text>
    <text x="958" y="233" font-size="17" fill="#9a3726">5 V</text>

    <path d="M1135 290 V313 M1115 313 H1155" stroke="#b24630" stroke-width="5" fill="none"/>
    <path d="M1115 333 Q1135 344 1155 333 M1135 340 V363" stroke="#43575d" stroke-width="5" fill="none"/>
    <text x="1163" y="315" font-size="23" fill="#9a3726">+</text>
    <text x="1163" y="347" font-size="23">−</text>
    <text x="1040" y="460" font-size="16" text-anchor="middle">Capacitor</text>
    <text x="1040" y="482" font-size="16" text-anchor="middle">500–1000 µF</text>
    <text x="1040" y="504" font-size="16" text-anchor="middle">≥ 6.3 V</text>
    <text x="1040" y="526" font-size="16" text-anchor="middle">at LED input</text>
    <g fill="#43575d"><circle cx="850" cy="555" r="6"/><circle cx="1135" cy="555" r="6"/></g>
    <text x="400" y="584" font-size="20" font-weight="700">Common ground: join all GND / − connections</text>
    <text x="42" y="628" font-size="17">Remove the VBUS-to-LED wire. Check the new supply, capacitor polarity and shared ground.</text>
    <text x="42" y="656" font-size="17">Connections shown, not physical pin positions. Disconnect USB and the LED supply before changing wires.</text>
  </g>
</svg>
