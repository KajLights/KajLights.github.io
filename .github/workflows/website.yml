name: Website and verified release catalogue
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [firmware-release-published]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Prepare the exact public implementation revision
        run: python scripts/prepare-source.py
      - run: npm ci
      - name: Acquire and mirror verified published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import-releases.py
      - name: Catalogue and installer contract checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
          npm run format:check
      - name: Build the static website
        run: npm run build
      - name: Build a temporary device for real protocol acceptance
        run: |
          python .deps/lightvm/tools/fetch_audio_core.py
          cmake -S .deps/lightvm -B build/test-device -DLIGHTVM_PLATFORM=host -DLIGHTVM_HTTP=ON -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/test-device --target lightvm --parallel 2
      - run: npx playwright install --with-deps chromium
      - name: Browser and device-session acceptance
        env:
          LIGHTVM_PYTHON: python
        run: npm run test:browser
      - name: Save the reviewable site and exact import evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.run_id }}
          path: |
            dist/
            implementation.json
            release-policy/
            test-results/
          retention-days: 14
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
      - name: Prepare Pages artifact after the explicit site cutover
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_WEBSITE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_WEBSITE == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
